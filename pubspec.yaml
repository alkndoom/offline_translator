name: offline_translator
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0-93.0.dev

dependencies:
  fllama: ^0.0.1
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.5
  get: ^4.7.3
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/offline_translator_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/offline_translator_icon.png"

  android_12:
    color: "#FFFFFF"
    image: "assets/icon/offline_translator_icon.png"

  ios: true
  android: true
